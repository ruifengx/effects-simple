indentation: 2
function-arrows: leading
haddock-style: single-line
import-grouping:
- name: Prelude
  rules:
  - glob: Prelude
- name: regular modules
  rules:
  - priority: 100
- name: local modules
  rules:
  - scope: local
indent-wheres: true
single-constraint-parens: never
single-deriving-parens: never
trailing-section-operators: false
